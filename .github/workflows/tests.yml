name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) no longer offers Python 3.9; 24.04 still does.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core suite
        run: python3 -B -m unittest discover -v
      - name: Regression runner
        run: |
          if [ -f tests/run_regression.py ]; then python3 -B tests/run_regression.py; fi
      - name: Research companion suite
        working-directory: staging/research-protocol
        run: python3 -B -m unittest discover -s tests -v
      - name: Architect companion suite
        working-directory: staging/architect-protocol
        run: python3 -B -m unittest discover -s tests -v
      - name: Docs Doctor
        # Exit 0 passes and 1 (WARN only, advisory under D-0013) is accepted;
        # 2 (FAIL) and 3 (could not run) fail the job.
        run: python3 -B scripts/docs-doctor.py . || [ $? -eq 1 ]
      - name: Skill registry
        run: python3 -B scripts/skill-registry.py .
      - name: Whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD
